# Doku-Referenz-Checks via d-check (ghcr.io/pt9912/d-check) — ersetzt
# das vendorte tools/docs-check.js (MR-003-Auflösung, Rollout
# 2026-06-12, JS-Familie). Scan über die gesamte Repo-Wurzel wie das
# Alt-Tool. codepaths-Wurzeln an b-cad angepasst — die vendorte
# Kurs-Kopie prüfte nur lab/, kurs/, tools/ (zwei davon existieren
# hier nicht); ./ und ../ werden immer erkannt.
# matrix/ids/spans/hostpaths: Referenz-Integritäts-Gate — normativ sind das
# Kurs-Regelwerk + harness/conventions.md (MR-011/MR-014), nicht dieser Kommentar.
# matrix adr->slice (MR-014, d-check v0.37.1): ADR-Koerper nennt keine slice-NNN
# (no-downward), ausser per <!-- d-check:status-provenance -->-Zeilenmarker.
# Beschreibung siehe: https://raw.githubusercontent.com/pt9912/d-check/refs/heads/main/README.md
scan:
  roots: ["."]
modules: [links, anchors, codepaths, spans, hostpaths, matrix, ids, planning, tracked, targets]
codepaths:
  roots: [docs, spec, harness, tools, src]
  # slice-033/MR-014: die tools/Dockerfile-FROM-Stage entfiel mit der Umstellung
  # von docs-check auf d-check.mk (Bind-Mount); slice-004 (done-archive,
  # eingefroren) nennt die Datei noch als Verifikations-Zeiger — Tombstone statt
  # Bruch (codepaths.ignore-refs, d-check-v0.34-Feature).
  # slice-042b: das io-`plan_geometry` entfiel mit der Hebung der 2D-Projektion in
  # den Kern (ADR-0019/ADR-0020: `projectPlan` → `hexagon/services/geometry`,
  # `PlanView`-Typen + `visibleLayerIds` → `model/`); ADR-0018 (Accepted/immutabel,
  # AGENTS §2.5) + slice-032c (done) nennen die entfernte Datei noch als
  # historischen Zeiger — Tombstone, kein Bruch (keine Schwellen-Lockerung, §2.6 n/a).
  # Diese drei bleiben BEWUSST modul-lokal (Alias-Form, nur `codepaths`): sie sind
  # als Inline-Code-Pfade zitiert, nicht als Markdown-Links — eine Hebung auf die
  # querschnittliche Form wuerde ihre Wirkung ohne Anlass auf `links`/`anchors`
  # ausweiten (slice-050, MR-006-Nachtrag LOW-3).
  ignore-refs:
    ["tools/Dockerfile", "src/adapters/io/plan_geometry.h",
     "src/adapters/io/plan_geometry.cpp"]

# slice-050: querschnittliches Referenz-Ventil (d-check >= v0.49.0) — anders als
# der modul-lokale codepaths-Alias oben honorieren `links`, `anchors` UND
# `codepaths` diese Eintraege gemeinsam. Noetig, weil die hier retirten Skripte
# auch als MARKDOWN-LINK zitiert sind, u. a. in harness/conventions.md MR-013 —
# einem nach Aufnahme unveraenderlichen Eintrag, den man nicht umtexten darf
# (AGENTS §2.5-Praxis, Muster MR-003->MR-007). Tombstone statt Fremd-Edit; das
# Handbuch nennt genau diesen Fall. Gate-Wirksamkeit bleibt: ohne passenden
# Eintrag meldet ein fehlendes Ziel weiter. Keine Schwellen-Lockerung (§2.6 n/a).
ignore-refs:
  - refs: ["tools/gate-consistency.sh", "tools/idlink.py"]

# slice-050: Deklarations-Konsistenz Doku <-> Build-Targets (loest den
# Doku-/Makefile-Kern von tools/gate-consistency.sh ab, d-check-Modul `targets`).
# makefiles: alle DREI — die realen Regeln von `make a-check`/`docs-check` leben
# in den Includes, ohne sie gaebe es gate-phantom-Falschbefunde.
# doc-tables: BEIDE Honesty-Dokumente — gate-consistency.sh scannte ebenfalls
# beide; nur AGENTS.md wuerde den Korpus schrumpfen.
# `targets` prueft BIDIREKTIONAL und ist damit strenger als das abgeloeste,
# unidirektionale Skript (Gewinn): jede reale Regel muss in `authority` stehen.
# exempt-targets (EXAKTE Regelnamen, kein Glob): `help` und die internen
# d-check.mk-Distributoren, deren Vertrag unter anderem Namen dokumentiert ist
# (`doc-check` laeuft als `make docs-check`; `doc-planning`/`doc-tracked`/
# `doc-targets` sind dessen Teilmengen-Runner). Alles uebrige wurde in die
# AGENTS.md-§3-Tabelle aufgenommen statt ausgenommen.
targets:
  makefiles: [Makefile, a-check.mk, d-check.mk]
  doc-tables: [AGENTS.md, harness/README.md]
  authority: AGENTS.md
  exempt-targets: [help, doc-check, doc-planning, doc-tracked, doc-targets, doc-help]

# Referenz-Richtung: Spec-Straten verweisen nie abwärts auf ADRs/Planning-Slices
# (Markdown-Link-Form). Maßgeblich — NICHT dieser Kommentar — sind das gepinnte
# Kurs-Regelwerk (§Referenz-Richtung / SDP) und harness/conventions.md (MR-011
# Referenz-Integritäts-Gate). exclude-sections = die
# Provenance-Abschnitte (Historie/Geschichte); die Spec-Historie liegt zudem
# in spec/<name>-historie.md ausgelagert (außerhalb der matrix-Straten).
matrix:
  classes:
    - name: spec-straten
      paths: [spec/lastenheft.md, spec/spezifikation.md, spec/architecture.md]
    - name: adr
      paths: ["docs/plan/adr/[0-9]*.md"]
    - name: slice
      paths: ["docs/plan/planning/**/slice-*.md"]
      # Token-Erkennung (Verschärfung 2026-07-05, d-check v0.37.1, Feature ab
      # v0.31): eine Slice-Kennung als bare Token im ADR-/Spec-Körper ⇒
      # matrix-forbidden (Stable Dependencies / no-downward — stabile Straten
      # verweisen nicht auf volatile Slices), außer per Zeilen-Marker
      # <!-- d-check:status-provenance --> als Verifikations-Zeiger deklariert.
      token: 'slice-\d{3}'
    # slice-049: die ZEITLICHE Schicht als eigene Klasse. Prozess-Vokabular
    # »welle-N« (Projekt-Abwicklungs-Wellen) gehoert in die Roadmap/Planning,
    # NICHT in die Spec-Straten — spec/architecture.md Zeile 5 formuliert das
    # Prinzip selbst (»keine Wellen, Slices, Commit-Hashes oder Closure-Daten«),
    # und bis zu diesem Slice verletzten 56 Fundstellen es. Die vorhandenen
    # Regeln fingen das NICHT (echte Regel-Luecke, keine Fehlkonfiguration):
    # matrix verbot nur Links auf adr/slice + den Token `slice-\d{3}`, und
    # `welle-5` matcht den nicht; `ids` kennt »welle« als Familie nicht.
    #
    # `paths` ist LEER, und das ist Absicht (in-slice gemessen, nicht geraten):
    # diese Klasse traegt AUSSCHLIESSLICH den Token. Mit `paths:
    # [.../roadmap.md]` — so hatte der Plan es vorgesehen — wuerde die Regel
    # zusaetzlich den LINK spec-straten -> roadmap verbieten, und genau den
    # braucht architecture.md in seinem Prinzip-Satz (»die zeitliche Schicht lebt
    # in [roadmap]«). Baseline-Messung auf dem unbereinigten Stand: mit
    # roadmap-`paths` 57 Befunde (56 Token + 1 Falsch-Positiv auf diesem Link),
    # mit leeren `paths` 56 (nur Token). Die Klasse ist damit eine reine
    # Token-Traegerin; wo »welle-N« legitim wohnt, sagt die Prosa hier, nicht die
    # Konfiguration. Die Roadmap wird ohnehin NICHT geprueft — die Mechanik feuert
    # auf den `from`-Dokumenten der Regel unten, und eine `{from: temporal, ...}`-
    # Regel gibt es nicht (kein Folge-Autor soll eine Roadmap-Pruefung hineinlesen).
    #
    # `[Ww]` deckt Gross-/Kleinschreibung; das `-\d` fasst den IDENTIFIKATOR,
    # nicht Prosa wie »spaetere Welle« — und laesst damit den Prinzip-Satz in
    # architecture.md heil (kein Digit). Ein breiteres `[Ww]elle` wuerde genau
    # diesen Satz falsch flaggen (verworfen; benannte Grenze des Gates).
    - name: temporal
      paths: []
      token: '[Ww]elle-\d'
  rules:
    - {from: spec-straten, to: adr, allow: false}
    - {from: spec-straten, to: slice, allow: false}
    - {from: adr, to: slice, allow: false}
    # slice-049: Spec-Straten sind prozess-/zeit-rein (Verschaerfung, kein
    # Carveout — AGENTS §2.6 n/a).
    - {from: spec-straten, to: temporal, allow: false}
  status:
    forbidden: [superseded, deprecated]
  # Grandfathering: die vor der Verschärfung Accepted-ADRs (0001–0017) nennen
  # Slices als Verifikations-Zeiger im Körper (immutabel, AGENTS §2.5) — ganz
  # exempt; ab ADR-0018 gilt die Disziplin (Folge-Slice-Nummern nur im mutablen
  # ADR-Index, Präzedenz-Verweise per ADR statt Slice).
  exempt-paths: ["docs/plan/adr/000[1-9]-*.md", "docs/plan/adr/001[0-7]-*.md"]
  exclude-sections: [Historie, Geschichte, Änderungshistorie]

# Linkpflicht für Kennungen (Adaption MR-011): alle 7 ID-Familien über den
# Voll-Korpus, link-policy always (nackte UND Inline-Code-Vorkommen). done-archive
# via scope.ignore raus (eingefroren). Logs (CHANGELOG/reviews/*-historie) via
# exempt-paths (je Pattern unten) von der ID-Linkpflicht befreit. Maßgeblich —
# statt eines hier driftenden Verhaltens-Texts — sind die Adaption MR-011
# (harness/conventions.md) und die in d-check.mk gepinnte d-check-Version
# (deren exempt-Semantik). Fehlende ID-Links repariert `make doc-repair` (d-check
# --repair) als Patch — siehe AGENTS.md §3; das frueher hier genutzte lokale
# Generator-Skript ist retired (slice-050, MR-022).
# LH-FA-Regex D3-fest ([A-Z][A-Z0-9]*); Cross-Stratum: Ziel = kanonische
# Definitionsdatei der Familie, unabhängig von der Fundstelle.
ids:
  scope:
    roots: ["."]
    ignore: ["docs/plan/planning/done-archive"]
  patterns:
    - regex: 'ADR-\d{4}'
      target: docs/plan/adr/
      link-policy: always
      exempt-paths: [CHANGELOG.md, "docs/reviews/**", "spec/*-historie.md"]
    - regex: 'MR-\d{3}'
      target: harness/conventions.md
      link-policy: always
      exempt-paths: [CHANGELOG.md, "docs/reviews/**", "spec/*-historie.md"]
    - regex: 'LH-(FA-[A-Z][A-Z0-9]*|QA)-\d+'
      target: spec/lastenheft.md
      link-policy: always
      exempt-paths: [CHANGELOG.md, "docs/reviews/**", "spec/*-historie.md"]
    - regex: 'ACC-\d+'
      target: spec/lastenheft.md
      link-policy: always
      exempt-paths: [CHANGELOG.md, "docs/reviews/**", "spec/*-historie.md"]
    - regex: 'OBJ-\d+'
      target: spec/lastenheft.md
      link-policy: always
      exempt-paths: [CHANGELOG.md, "docs/reviews/**", "spec/*-historie.md"]
    - regex: 'REQ-TEC-\d+'
      target: spec/spezifikation.md
      link-policy: always
      exempt-paths: [CHANGELOG.md, "docs/reviews/**", "spec/*-historie.md"]
    - regex: 'E-(IO|VAL|GEO|PLG)-\d+'
      target: spec/spezifikation.md
      link-policy: always
      exempt-paths: [CHANGELOG.md, "docs/reviews/**", "spec/*-historie.md"]

# Modul commits (slice-034, MR-015): Traceability-Kennung je Commit-Message über
# eine Range — macht AGENTS §4 computational. NICHT im Default-modules-Set (git-
# abhängig via --range/--commit-msg); läuft über `make doc-commits` (CI-Liste,
# Muster schema-check/io-smoke), nicht im hermetischen `make gates`. id-patterns =
# b-cads gelebte Kennungs-Familien (slice dominiert; ADR/MR/LH ebenfalls — bewusst
# breiter als der §4-Wortlaut "LH/ADR", der die slice-/MR-Praxis nicht abbildet).
commits:
  id-patterns:
    - 'slice-\d{3}'
    - 'ADR-\d{4}'
    - 'MR-\d{3}'
    - 'LH-(FA-[A-Z][A-Z0-9]*|QA)-\d+'
  exempt-pattern: '^(Merge |Revert )'

# Modul vcs (slice-035, MR-016): git-Diff-Immutabilität des ADR-Core über eine Range —
# macht AGENTS §2.5 (Accepted-ADRs immutabel) computational. NICHT im modules-Set (git-
# abhängig via --range/--staged); läuft über `make doc-immutable` (CI-Liste, Muster
# commits/schema-check), nicht im hermetischen `make gates`. immutable-when trifft b-cads
# ADR-Status-Zeile (Zeile 3); head-allow = die §2.5-Supersede-Mechanik; die mutable
# ## Geschichte-Provenance zählt nicht zum Core. Löst das adr-check-Skript-Muster ab
# (a-check-Präzedenz, wie commits/trace-check).
vcs:
  paths: ["docs/plan/adr/[0-9]*.md"]
  immutable-when: '^\*\*Status:\*\* Accepted'
  status-line: '^\*\*Status:\*\*'
  exclude-sections: [Geschichte]
  head-allow: '^\*\*Status:\*\* (Accepted|Superseded by ADR-\d{4})'

# Modul planning (slice-036, MR-017): Roadmap-↔-in-progress-Lifecycle-Konsistenz — der
# Ruhe-Marker steht im `## Aktuelle Welle`-Block genau dann, wenn kein slice-* in
# in-progress/ liegt (planning-drift). HERMETISCH (nur Arbeitsbaum, kein git) -> kann als
# modules-Member echter make-gates-Bestandteil sein (Entscheidung slice-036). Löst das
# planning-check-Skript-Muster ab (letztes Familien-Skript).
planning:
  roadmap: docs/plan/planning/in-progress/roadmap.md
  heading: "## Aktuelle Welle"        # explizit statt Default [Review-L2]
  slice-glob: "slice-*"               # explizit statt Default [Review-L2]
  marker: "Keine offenen Slices"      # RESERVIERTER Sentinel [Review-L3]: nur vom Toggle
                                      # geschrieben, exakt-case, NIE als Prosa im AW-Block

# Modul tracked (slice-037, MR-018): Getrackt-Status auflösbarer, existierender Link-/Bild-Ziele
# gegen den git-Index — untrackte/gitignorierte Ziele fehlen auf jedem frischen Klon
# (target-untracked). Braucht .git (im Bind-Mount da), OHNE Range -> Gate-Member (ins modules-Set,
# wie planning). exempt-targets = Ventil für absichtlich untrackte/generierte Ziele (z. B.
# build/**); heute leer (kein build/-Dir, Baseline 0).
tracked:
  exempt-targets: []
